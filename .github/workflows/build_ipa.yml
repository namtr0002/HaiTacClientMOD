name: Build iOS IPA (CauCaHaiTac)

on:
  push:
    branches:
      - main
    paths:
      - 'ios_parts/**'
      - '.github/workflows/build_ipa.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package CauCaHaiTac IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Combine and Extract Xcode Project
        run: |
          mkdir -p ios-build
          cat ios_parts/XCodeCauCaHaiTac.zip.part* > XCodeCauCaHaiTac.zip
          unzip -q XCodeCauCaHaiTac.zip -d ios-build/
          cd ios-build
          ls -la

      - name: Patch Missing Frameworks & Objective-C Symbols
        run: |
          python3 -c "
          import os

          for root, dirs, files in os.walk('ios-build'):
              for f in files:
                  if f == 'iOSPluginsBridge.mm':
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8') as fp:
                          text = fp.read()
                      text = text.replace('#import <MessageUI/MessageUI.h>', '// #import <MessageUI/MessageUI.h>')
                      text = text.replace('[MFMessageComposeViewController canSendText]', 'NO')
                      text = text.replace('MFMessageComposeViewController', 'id')
                      with open(p, 'w', encoding='utf-8') as fp:
                          fp.write(text)
                      print(f'Successfully patched {p}')
                  elif f == 'project.pbxproj':
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8') as fp:
                          text = fp.read()
                      text = text.replace('\"-weak-lSystem\",', '\"-weak-lSystem\",\n\t\t\t\t\t\"-framework\",\n\t\t\t\t\tMessageUI,')
                      with open(p, 'w', encoding='utf-8') as fp:
                          fp.write(text)
                      print(f'Successfully patched {p}')
          "

      - name: Build Archive (Unsigned / Ad-Hoc)
        run: |
          cd ios-build
          xcodebuild clean archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/CauCaHaiTac.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload to IPA
        run: |
          cd ios-build
          mkdir -p Payload
          cp -r build/CauCaHaiTac.xcarchive/Products/Applications/*.app Payload/
          zip -r -q CauCaHaiTac.ipa Payload
          mv CauCaHaiTac.ipa ../

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CauCaHaiTac-iOS-IPA
          path: CauCaHaiTac.ipa
