name: Build iOS IPA (CauCaHaiTac)

on:
  push:
    branches:
      - main
    paths:
      - 'ios_parts/**'
      - '.github/workflows/build_ipa.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package CauCaHaiTac IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobachev/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Combine and Extract Xcode Project
        run: |
          mkdir -p ios-build
          cat ios_parts/XCodeCauCaHaiTac.zip.part* > XCodeCauCaHaiTac.zip
          unzip -q XCodeCauCaHaiTac.zip -d ios-build/
          cd ios-build
          ls -la

      - name: Build Archive (Unsigned / Ad-Hoc)
        run: |
          cd ios-build
          xcodebuild clean archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath build/CauCaHaiTac.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload to IPA
        run: |
          cd ios-build
          mkdir -p Payload
          cp -r build/CauCaHaiTac.xcarchive/Products/Applications/*.app Payload/
          zip -r -q CauCaHaiTac.ipa Payload
          mv CauCaHaiTac.ipa ../

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CauCaHaiTac-iOS-IPA
          path: CauCaHaiTac.ipa
