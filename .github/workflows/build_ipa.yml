name: Build iOS IPA (HaiTacZ)

on:
  push:
    branches:
      - main
    paths:
      - 'ios_parts/**'
      - '.github/workflows/build_ipa.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package HaiTacZ IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Combine and Extract Xcode Project
        run: |
          mkdir -p ios-build
          if ls ios_parts/XCodeHaiTacZ.zip.part* 1> /dev/null 2>&1; then
            cat ios_parts/XCodeHaiTacZ.zip.part* > XCodeHaiTacZ.zip
            unzip -q XCodeHaiTacZ.zip -d ios-build/
          elif ls ios_parts/XCodeCauCaHaiTac.zip.part* 1> /dev/null 2>&1; then
            cat ios_parts/XCodeCauCaHaiTac.zip.part* > XCodeCauCaHaiTac.zip
            unzip -q XCodeCauCaHaiTac.zip -d ios-build/
          else
            cat ios_parts/*.part* > XCodeProject.zip
            unzip -q XCodeProject.zip -d ios-build/
          fi
          cd ios-build
          ls -la

      - name: Patch Native iOS Bridge
        run: |
          python3 -c "
          import os

          bridge_code = '''#import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>

          extern \"C\" {
              void _SMSsend(const char* tophone, const char* withtext, int n) {
                  NSLog(@\"[iOSPlugins] _SMSsend: tophone=%s, withtext=%s, n=%d\", tophone ? tophone : \"\", withtext ? withtext : \"\", n);
              }
              int _unpause() { return 0; }
              int _checkRotation() {
                  UIInterfaceOrientation orientation = [UIApplication sharedApplication].statusBarOrientation;
                  return UIInterfaceOrientationIsLandscape(orientation) ? 1 : 0;
              }
              int _back() { return 0; }
              int _Send() { return 0; }
              void _purchaseItem(const char* itemID, const char* userName, const char* gameID) {
                  NSLog(@\"[iOSPlugins] _purchaseItem: itemID=%s, user=%s, game=%s\", itemID ? itemID : \"\", userName ? userName : \"\", gameID ? gameID : \"\");
              }
          }
          '''

          for root, dirs, files in os.walk('ios-build'):
              for f in files:
                  if f == 'iOSPluginsBridge.mm':
                      p = os.path.join(root, f)
                      with open(p, 'w', encoding='utf-8') as fp:
                          fp.write(bridge_code)
                      print(f'Successfully wrote clean native bridge to {p}')
          "

      - name: Build Archive (Unsigned / Ad-Hoc)
        run: |
          cd ios-build
          xcodebuild clean archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/HaiTacZ.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload to IPA
        run: |
          cd ios-build
          mkdir -p Payload
          cp -r build/HaiTacZ.xcarchive/Products/Applications/*.app Payload/
          zip -r -q HaiTacZ.ipa Payload
          cp HaiTacZ.ipa HaiTacZ129.ipa
          mv HaiTacZ.ipa ../
          mv HaiTacZ129.ipa ../

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaiTacZ-iOS-IPA
          path: |
            HaiTacZ.ipa
            HaiTacZ129.ipa
